{{define "content"}}
<h1>{{DeleteWorkspaceH .Workspace.Slug}}</h1>
<p>{{DeleteWorkspaceDHTML .Workspace.Slug .Workspace.IssueCount .Workspace.DiscussionCount}}</p>
<p>{{DeleteLastWorkspace}}</p>
<form method="post" action="/w/{{.Workspace.Slug}}/delete" class="form-actions">
  <a class="btn btn-quiet" href="/workspaces">{{BtnCancel}}</a>
  <button type="submit" class="btn btn-danger">{{BtnDeleteWorkspace}}</button>
</form>
{{end}}
