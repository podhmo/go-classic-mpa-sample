{{define "content"}}
<div class="page-head">
  <h1>{{DeleteIssue .Issue.ID}}</h1>
</div>

<div class="card">
  <p>{{DeleteConfirmHTML .Issue.Title}}</p>
  <p class="muted">{{IssueDeleteWarn}}</p>
  <form method="post" action="/w/{{.Workspace.Slug}}/issues/{{.Issue.ID}}/delete" class="form-actions">
    <a class="btn btn-quiet" href="/w/{{.Workspace.Slug}}/issues/{{.Issue.ID}}">{{BtnCancel}}</a>
    <button type="submit" class="btn btn-danger">{{BtnDeleteIssue}}</button>
  </form>
</div>
{{end}}
