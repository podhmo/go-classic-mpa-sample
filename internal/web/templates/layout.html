{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Issue Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='none' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="/issues">Issue Tracker</a>
      <nav class="site-nav" aria-label="Main">
        <a href="/issues">Issues</a>
        <a class="btn btn-primary" href="/issues/new">New issue</a>
      </nav>
    </div>
  </header>
  <main class="container main-content">
    {{template "content" .}}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>A classic multi-page app built with Go's net/http and html/template. No JavaScript.</p>
    </div>
  </footer>
</body>
</html>
{{end}}
