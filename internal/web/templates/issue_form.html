{{define "content"}}
<div class="page-head">
  <h1>{{.Heading}}</h1>
</div>

<form method="post" action="{{.Action}}" class="card issue-form" novalidate>
  <div class="field">
    <label for="f-title">Title <span class="req" aria-hidden="true">*</span></label>
    <input type="text" id="f-title" name="title" value="{{.Input.Title}}" maxlength="{{maxTitleLen}}" required{{if .Errors.Title}} aria-invalid="true" aria-describedby="f-title-error"{{end}}>
    {{if .Errors.Title}}<p class="field-error" id="f-title-error" role="alert">{{.Errors.Title}}</p>{{end}}
  </div>

  <div class="field">
    <label for="f-body">Body</label>
    <textarea id="f-body" name="body" rows="10"{{if .Errors.Body}} aria-invalid="true" aria-describedby="f-body-error"{{end}}>{{.Input.Body}}</textarea>
    {{if .Errors.Body}}<p class="field-error" id="f-body-error" role="alert">{{.Errors.Body}}</p>{{end}}
    <p class="field-hint">Markdown (GFM) supported. Raw HTML is not rendered; line breaks are preserved.</p>
  </div>

  {{if .Labels}}
  <fieldset class="field label-picker">
    <legend>Labels</legend>
    {{range .Labels}}
    <label class="label-option" for="label-{{.ID}}">
      <input type="checkbox" id="label-{{.ID}}" name="label_id" value="{{.ID}}"{{if isChecked .ID $.Input.LabelIDs}} checked{{end}}>
      <span class="label-badge" style="background-color: {{.Color}}">{{.Name}}</span>
    </label>
    {{end}}
  </fieldset>
  {{end}}

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{.SubmitLabel}}</button>
    <a class="btn btn-quiet" href="/issues">Cancel</a>
  </div>
</form>
{{end}}
